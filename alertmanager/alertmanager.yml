# ai-generated: 100% - Codex wrote severity routing and same-system inhibition, validated with amtool and live cases.
global:
  resolve_timeout: 5m
route:
  receiver: chat
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
    - matchers: ['severity=~"P2|P3"']
      receiver: chat
receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  # Scope by a label explicitly present on both shop alerts; svcdesk has its own system.
  - source_matchers: ['severity="P1"', 'system="shop"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [system]
