# Course template - Lab 1 compose contract (API.md section 9).
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on svcdesk or kb-index, and images that need
# no network once built (dependencies are installed at build time, never at start).
# Lab 3 permits configuration binds on observability services; svcdesk and kb-index have none.
name: lab1-svcdesk

services:
  svcdesk:
    build: .
    # Keep the image identity stable when the grader builds and runs in separate stages.
    image: lab1-svcdesk:local
    pull_policy: never
    ports:
      - "127.0.0.1:18080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      KB_INDEX_URL: http://kb-index:8080
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Stretch S3 (own tests): uncomment and adapt. The checker builds every image up front
  # (docker compose --profile tests build; a tests image that does not build costs S3, never Core), then runs
  #   docker compose --profile tests run --rm --build tests
  # (300 s cap) and requires exit code 0 and a last stdout line "ITSMLAB-TESTS: passed=<n> failed=0" with n >= 10.
  # As written, the runner lives at src/tests/run.py (Dockerfile.example copies src/ to /app/src, so it is
  # importable as tests.run from /app/src); adjust command and working_dir if you keep the tests elsewhere.
  # depends_on with condition: service_healthy needs the healthcheck above (uncomment it too); otherwise
  # a cold run can race the service, so make your runner retry /health for a few seconds first.
  # Like svcdesk, the tests image is built before the grader blocks egress: install everything at build time.
  tests:
    build: .
    # Stage 1 builds this image before the grading sandbox disables egress.
    image: lab1-svcdesk-tests:local
    pull_policy: never
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080
    command: ["python", "-m", "tests.run"]

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: adiker
      SEEDED_TOXIC_ADMIN: "0"
    ports: ["127.0.0.1:18081:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    ports: ["127.0.0.1:19090:9090"]
    volumes: ["./prometheus:/etc/prometheus:ro"]
    depends_on: [svcdesk]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [gap]
    ports: ["127.0.0.1:18474:8474", "127.0.0.1:18666:8666"]
    depends_on: [svcdesk]

volumes:
  svcdesk-data:
